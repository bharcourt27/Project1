<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="./assets/css/style.css">
  <title>My Landing Page</title>
</head>

<body>
  <header>
    <nav class="text-right">
      <ul>
        <li> <a href="https://github.com/">Github</a></li>
        <li> <a href="#">Portfolio</a></li>
        <li> <a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1 class="text-center">My New Website</h1>
    <figure>
      <img src="https://scontent.find2-1.fna.fbcdn.net/v/t39.30808-6/279018522_10104893911738764_8910516096900337625_n.jpg?_nc_cat=108&ccb=1-7&_nc_sid=127cfc&_nc_ohc=elBJ2KUZoMIQ7kNvgG6Xi7o&_nc_zt=23&_nc_ht=scontent.find2-1.fna&_nc_gid=ANvlf7II2YicVt7MEvx4amt&oh=00_AYC52ZV1pdGHY-bH_1Xm7gx2lKbe-q95LLkdWT8Es2kZLQ&oe=67427C7F" alt="My dogs Arlo and Tilly">
      <figcaption class="text-center">Lorem ipsum dolor, sit amet consectetur adipisicing elit.</figcaption>
    </figure>
    <section id="contact">
      <h2 class="text-center">Contact Me</h2>
      <form>
        <ul>
          <li>
            <label class="text-right" for="name">Name:</label>
            <input type="text" id="name" placeholder="First Last"/>
          </li>
          <li>
            <label class="text-right" for="email">Email:</label>
            <input type="text" id="email" placeholder="me@example.com"/>
          </li>
        </ul>
        <div class="text-center">
          <button type="submit">SEND</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="text-center">
    © 2024 My New Website Productions 
  </footer>
    
</body>
</html>
